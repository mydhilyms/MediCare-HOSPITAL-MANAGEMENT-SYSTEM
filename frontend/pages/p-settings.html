<div class="page" id="page-settings">
  <div class="page-header">
    <h1 class="page-title">Settings</h1>
    <p class="page-subtitle">Configure hospital system preferences</p>
  </div>

  <div class="two-col">
    <!-- Left column -->
    <div>
      <div class="card mb-4">
        <div class="card-header"><span class="card-title"><i class="fas fa-user-circle text-primary" style="margin-right:.5rem"></i>Profile Settings</span></div>
        <div class="card-body">
          <div style="display:flex;align-items:center;gap:1.25rem;margin-bottom:1.5rem">
            <div class="avatar avatar-xl" style="background:#2563EB">AD</div>
            <div>
              <div class="fw-700">Dr. Admin User</div>
              <div class="text-sm text-muted mb-2">Super Administrator</div>
              <button class="btn btn-outline btn-sm" onclick="toast('Upload feature coming soon','info')"><i class="fas fa-camera"></i> Change Photo</button>
            </div>
          </div>
          <div class="two-col">
            <div class="form-group"><label>First Name</label><input class="form-control" value="Admin" /></div>
            <div class="form-group"><label>Last Name</label><input class="form-control" value="User" /></div>
          </div>
          <div class="form-group"><label>Email</label><input class="form-control" value="admin@medcare.com" /></div>
          <div class="form-group"><label>Phone</label><input class="form-control" value="+1 (555) 000-1234" /></div>
          <div class="form-group"><label>Department</label>
            <select class="form-control"><option>Administration</option><option>Cardiology</option><option>Neurology</option></select>
          </div>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-header"><span class="card-title"><i class="fas fa-lock text-warning" style="margin-right:.5rem"></i>Security</span></div>
        <div class="card-body">
          <div class="form-group"><label>Current Password</label><input type="password" class="form-control" placeholder="••••••••" /></div>
          <div class="form-group"><label>New Password</label><input type="password" class="form-control" placeholder="••••••••" /></div>
          <div class="form-group"><label>Confirm New Password</label><input type="password" class="form-control" placeholder="••••••••" /></div>
          <button class="btn btn-warning btn-sm" onclick="toast('Password updated successfully','success')"><i class="fas fa-key"></i> Update Password</button>
        </div>
      </div>
    </div>

    <!-- Right column -->
    <div>
      <div class="card mb-4">
        <div class="card-header"><span class="card-title"><i class="fas fa-hospital text-teal" style="margin-right:.5rem"></i>Hospital Information</span></div>
        <div class="card-body">
          <div class="form-group"><label>Hospital Name</label><input class="form-control" value="MediCare General Hospital" /></div>
          <div class="form-group"><label>Registration Number</label><input class="form-control" value="HOS-2019-4821" /></div>
          <div class="form-group"><label>Address</label><textarea class="form-control" rows="3">123 Healthcare Avenue, Medical District, NY 10001</textarea></div>
          <div class="two-col">
            <div class="form-group"><label>Phone</label><input class="form-control" value="+1 (555) 800-9000" /></div>
            <div class="form-group"><label>Emergency</label><input class="form-control" value="+1 (555) 911-0000" /></div>
          </div>
          <div class="form-group"><label>Email</label><input class="form-control" value="info@medcare.com" /></div>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-header"><span class="card-title"><i class="fas fa-bell text-purple" style="margin-right:.5rem"></i>Notifications</span></div>
        <div class="card-body" id="notif-toggles">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>
  </div>

  <div style="display:flex;justify-content:flex-end;gap:1rem;margin-top:.5rem">
    <button class="btn btn-outline" onclick="toast('Changes discarded','warning')">Cancel</button>
    <button class="btn btn-primary" id="settings-save"><i class="fas fa-save"></i> Save Settings</button>
  </div>
</div>
